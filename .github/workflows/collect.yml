name: Collect data

on:
  schedule:
    - cron: '0 * * * *'  # cada hora en punto UTC
  workflow_dispatch:     # botón manual

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build .env from secrets
        run: |
          cat > .env <<EOF
          SHOPIFY_STORE=${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID=${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET=${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION=${{ secrets.SHOPIFY_API_VERSION }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID=${{ secrets.META_AD_ACCOUNT_ID }}
          META_API_VERSION=${{ secrets.META_API_VERSION }}
          EOF

      - name: Collect Shopify
        run: python pipeline/collect_shopify.py
        continue-on-error: true

      - name: Collect Meta
        run: python pipeline/collect_meta.py
        continue-on-error: true

      - name: Merge
        run: python pipeline/merge.py

      - name: Commit data
        run: |
          git config user.name "lolu-dashboard-bot"
          git config user.email "bot@lolu.com.co"
          git add data/
          git diff --staged --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
